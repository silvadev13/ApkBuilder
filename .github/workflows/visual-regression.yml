name: Visual Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
            npx playwright install --with-deps
          fi

      - name: Run Playwright tests
        run: |
          if [ -f package.json ]; then
            npx playwright test
          fi

      # 1. Upload artifacts (diff images + full report)
      - name: Upload Playwright Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # 2. Post or update visual regression summary in PR comment
      - name: Post Visual Diff Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const testResultsDir = path.join(process.cwd(), 'test-results');
            if (!fs.existsSync(testResultsDir)) return;

            // Recursively locate all generated Playwright diff files
            function findDiffFiles(dir) {
              let results = [];
              const list = fs.readdirSync(dir);
              list.forEach(file => {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat && stat.isDirectory()) {
                  results = results.concat(findDiffFiles(filePath));
                } else if (file.endsWith('-diff.png')) {
                  results.push(filePath);
                }
              });
              return results;
            }

            const diffFiles = findDiffFiles(testResultsDir);
            if (diffFiles.length === 0) return;

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);

            // Construct Markdown comment body
            let commentBody = `## 📸 Visual Regression Test Failures\n\n`;
            commentBody += `Playwright detected **${diffFiles.length}** layout/visual difference(s) in commit \`${commitSha}\`.\n\n`;
            commentBody += `| Test Suite / Dir | Snapshot Diff Image | Status |\n`;
            commentBody += `| :--- | :--- | :--- |\n`;

            diffFiles.forEach(diffPath => {
              const fileName = path.basename(diffPath);
              const testDirName = path.basename(path.dirname(diffPath));
              commentBody += `| \`${testDirName}\` | \`${fileName}\` | ❌ Mismatch |\n`;
            });

            commentBody += `\n---\n`;
            commentBody += `### 🔍 How to Review & Fix\n`;
            commentBody += `1. **View Diff Slider:** Download the [playwright-visual-diffs artifact](${runUrl}) from this run to open the interactive diff viewer.\n`;
            commentBody += `2. **Accept New Baseline:** If these changes are intentional, update snapshots locally inside Docker:\n`;
            commentBody += `   \`\`\`bash\n   npm run test:docker:update\n   \`\`\`\n`;
            commentBody += `3. Commit the updated baseline PNGs to update this PR.`;

            // PR Comment Upsert Logic (Update existing bot comment or create a new one)
            const issueNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const BOT_HEADER = '## 📸 Visual Regression Test Failures';
            const existingComment = comments.find(c => c.body.includes(BOT_HEADER));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
              console.log(`Updated existing PR comment #${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });
              console.log(`Created new PR comment on #${issueNumber}`);
            }
